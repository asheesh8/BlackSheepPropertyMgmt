<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Black Sheep forms</title></head>
  <body>
    <form name="estimate-request" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="estimate-request" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="location" />
      <input type="text" name="property-type" />
      <input type="text" name="service" />
      <textarea name="description"></textarea>
      <input type="text" name="timing" />
      <input type="file" name="photo" />
      <input type="text" name="preferred-contact" />
    </form>
  </body>
</html>
